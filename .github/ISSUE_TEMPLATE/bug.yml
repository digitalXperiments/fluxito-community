name: Bug report
description: Something is broken or behaving unexpectedly.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! The more we have upfront, the faster we can reproduce and fix.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the bug. Include exact error messages if any.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: |
        1. Go to '...'
        2. Click '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Fluxito version
      description: git SHA or release tag
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How are you running it?
      options:
        - Docker Compose (local)
        - Render
        - Railway
        - Self-hosted on my own infra
        - Other (describe in 'What happened')
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste recent log lines if available — please redact secrets.
      render: shell
