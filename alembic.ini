# Alembic Configuration for Fluxito (async PostgreSQL)
#
# Database URL is injected from settings at runtime (see env.py).
# This file defines the migration script location and logging behavior.

[alembic]
# Migration scripts location (relative to this file)
script_location = %(here)s/app/db/migrations

# File name template: {rev}_{slug}.py (standard format).
# For date-prefixed files, uncomment below and set recursive_version_locations=true:
# file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Add current directory to sys.path (needed to import app config at migration time)
prepend_sys_path = .

# Timezone for migration file timestamps (leave blank for localtime)
# timezone =

# Truncate migration slug to this length (default 40, usually sufficient)
# truncate_slug_length = 40

# Allow .pyc/.pyo files without source .py in versions/ directory
# sourceless = false

# Set to true to run env.py during 'revision' command (for autogenerate)
# revision_environment = false

# Use OS default path separator (os.pathsep)
path_separator = os

# Set to true to search version directories recursively
# (useful for date-based subdirectories)
# recursive_version_locations = false

# Output encoding for generated migration files
# output_encoding = utf-8

# Database URL is set by env.py from settings.DATABASE_URL
# Do not hardcode credentials here
sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]
# Post-write hooks run after new migration files are generated.
# Uncomment below to auto-format migrations with ruff:
# hooks = ruff
# ruff.type = exec
# ruff.executable = ruff
# ruff.options = check --fix REVISION_SCRIPT_FILENAME

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
