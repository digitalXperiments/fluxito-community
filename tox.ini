[tox]
# Test environments: lint, typecheck, test (run in sequence by default)
envlist = lint, typecheck, test
skipsdist = true

[testenv]
# Forward host/CI env (TEST_DATABASE_URL, DATABASE_URL, REDIS_URL, …).
# Must live on [testenv] — tox 4 ignores passenv under [tox].
passenv = *
setenv =
    # Ensure pip installs from cache when available
    PIP_CACHE_DIR = {envtmpdir}/.pip

[testenv:lint]
description = ruff lint + format check (fast, fails fast)
deps = ruff==0.8.4
commands =
    ruff check app tests
    ruff format --check app tests

[testenv:typecheck]
description = mypy static type checking on critical modules
deps =
    -r requirements.txt
    -r requirements-dev.txt
commands =
    mypy app/sql_safety.py app/auth/scopes.py app/config.py app/utils
# Exit early if mypy not installed (graceful degradation)
ignore_errors = false

[testenv:test]
description = pytest with coverage (requires Postgres + Redis running locally)
deps =
    -r requirements.txt
    -r requirements-dev.txt
commands =
    # Run pytest with coverage and verbose output
    pytest \
      --cov=app \
      --cov-branch \
      --cov-report=term-missing:skip-covered \
      --cov-report=xml:coverage.xml \
      -v \
      {posargs}

