# Render.com blueprint — one-click deploy.
# Provisions Postgres + Redis + the Fluxito app on Render's free/starter tiers.
# https://render.com/docs/blueprint-spec
#
# Usage:
#   1. Fork this repo on GitHub.
#   2. Go to https://dashboard.render.com/blueprints and click "New Blueprint".
#   3. Connect your fork and select this file.
#   4. Set APP_BASE_URL to your Render service URL (e.g. https://fluxito.onrender.com).
#   5. Set TOKEN_ENCRYPTION_KEY to a Fernet key:
#        python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
#      (Render's filesystem is ephemeral — keys generated at boot would be lost on redeploy.)
#   6. Click "Apply" and Render will build, deploy, and wire everything together.
#
# After deploy, visit /setup to finish onboarding, then /settings/integrations
# to add OAuth client credentials (Google, Meta, TikTok, etc.).

services:
  # ── Web application ─────────────────────────────────────────────────────────
  - type: web
    name: fluxito
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      # Set this to your public Render URL after the first deploy.
      - key: APP_BASE_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: fluxito-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: fluxito-redis
          property: connectionString
      # Auto-generated by Render — safe for APP_SECRET_KEY (random hex string).
      - key: APP_SECRET_KEY
        generateValue: true
      # Must be a valid Fernet key — generate with the command in the header comment
      # above and paste it here. Cannot use generateValue because Fernet requires
      # url-safe base64-encoded 32 bytes; a raw random string will fail on boot.
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      # Comma-separated Claude.ai / other MCP client callback URIs.
      - key: MCP_ALLOWED_REDIRECT_URIS
        value: https://claude.ai/api/mcp/auth_callback

  # ── Redis ────────────────────────────────────────────────────────────────────
  - type: redis
    name: fluxito-redis
    plan: starter
    ipAllowList: []

databases:
  # ── Postgres ─────────────────────────────────────────────────────────────────
  - name: fluxito-db
    plan: starter
    postgresMajorVersion: "15"
