worker_processes auto;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Performance ──────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ── Gzip compression ────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ── Upstream services (Docker Compose service names) ────────────────
    upstream app {
        server app:8001;
        keepalive 32;
    }

    server {
        listen 80 default_server;

        # ── Static files — proxied to the app (static is baked into the app
        #    image and served by FastAPI). No host mount needed, and assets
        #    always match the running app version.
        location /static/ {
            proxy_pass         http://app;
            proxy_http_version 1.1;
            proxy_set_header   Host       $http_host;
            proxy_set_header   Connection "";
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ── Health check — lightweight, no logging ─────────────────────
        location = /api/health {
            proxy_pass         http://app;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            access_log off;
        }

        # ── FastAPI app — everything else ─────────────────────────────
        location / {
            proxy_pass         http://app;
            proxy_http_version 1.1;

            # Use $http_host (not $host) so the port is preserved for clients
            # accessing via localhost:8000 or any non-standard port.
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            # Preserve upstream X-Forwarded-Proto (set by ngrok to "https") if
            # already present; otherwise fall back to the connection scheme.
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;

            proxy_set_header   Connection "";
            # Long timeout for AI endpoints (chat streaming)
            proxy_read_timeout 300;
        }

        # ── MCP Streamable HTTP — still wants no buffering (POST response
        #    is a chunked JSON-RPC/SSE stream) and a generous read timeout.
        #    The X-Accel-Buffering header tells upstream edge proxies to
        #    pass chunks through immediately instead of buffering.
        location = /mcp {
            proxy_pass         http://app;
            proxy_http_version 1.1;
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header   Connection "";
            proxy_read_timeout 600;
            proxy_buffering    off;
            add_header         X-Accel-Buffering no always;
        }
    }
}
